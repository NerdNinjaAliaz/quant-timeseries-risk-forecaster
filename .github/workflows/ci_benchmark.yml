name: Quant Risk Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run zero-dependency functional & quantitative test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Install ML dependencies & verify live PyTorch tensors
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from pathlib import Path; from src.data_pipeline import load_and_prepare_data; from src.models import build_model; p = load_and_prepare_data(Path('data/BTC-USD.csv')); assert p.X_train.shape == (1901, 28, 5); assert p.X_test.shape == (505, 28, 5); m = build_model('GRU'); print('Verified PyTorch GRU params:', sum(x.numel() for x in m.parameters()))"
